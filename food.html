<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seleção de Comida</title>
  <link rel="stylesheet" href="css/food.css" />
</head>
<body>
  <div id="foodquestion">
    <b>Que comida você gostaria de comer?</b>
  </div>

  <div class="food-selection">
    <div class="food-item">
      <img src="food/hamburguer.jpg" alt="Hambúrguer" />
      <label>
        <input type="checkbox" name="food" value="Hambúrguer" />
        Hambúrguer
      </label>
    </div>
    <div class="food-item">
      <img src="food/cachorro-quente.jpg" alt="Cachorro-quente" />
      <label>
        <input type="checkbox" name="food" value="Cachorro-quente" />
        Cachorro-quente
      </label>
    </div>
    <div class="food-item">
      <img src="food/pizza.jpg" alt="Pizza" />
      <label>
        <input type="checkbox" name="food" value="Pizza" />
        Pizza
      </label>
    </div>
    <div class="food-item">
      <img src="food/cuscuz.jpg" alt="Cuscuz temperado" />
      <label>
        <input type="checkbox" name="food" value="Cuscuz temperado" />
        Cuscuz temperado
      </label>
    </div>
    <div class="food-item">
      <img src="food/espetinho.jpg" alt="Espetinho de carne" />
      <label>
        <input type="checkbox" name="food" value="Espetinho de carne" />
        Espetinho de carne
      </label>
    </div>
    <div class="food-item">
      <img src="food/miojo.jpg" alt="Miojo" />
      <label>
        <input type="checkbox" name="food" value="Miojo" />
        Miojo
      </label>
    </div>
    <div class="food-item">
      <img src="food/bolo.jpg" alt="Bolo" />
      <label>
        <input type="checkbox" name="food" value="Bolo" />
        Bolo
      </label>
    </div>
    <div class="food-item">
      <img src="food/acai.jpeg" alt="Açaí" />
      <label>
        <input type="checkbox" name="food" value="Açaí" />
        Açaí
      </label>
    </div>
  </div>

  <button class="button" onclick="storeSelections()">Continuar</button>

  <script src="script.js"></script>
</body>
</html>
